<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="LatencyLab stopwatch">
  <defs>
    <linearGradient id="ll-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9575cd"/>
      <stop offset="1" stop-color="#7e57c2"/>
    </linearGradient>
  </defs>
  <!-- crown / top button -->
  <rect x="54" y="8" width="20" height="12" rx="3" fill="#7e57c2"/>
  <rect x="60" y="18" width="8" height="10" rx="2" fill="#7e57c2"/>
  <!-- side start button -->
  <rect x="97" y="30" width="14" height="9" rx="3" transform="rotate(45 104 34)" fill="#ffe135"/>
  <!-- outer case -->
  <circle cx="64" cy="76" r="44" fill="none" stroke="url(#ll-body)" stroke-width="8"/>
  <circle cx="64" cy="76" r="35" fill="none" stroke="#ffe135" stroke-width="2" opacity="0.55"/>
  <!-- tick marks -->
  <g stroke="#9aa0aa" stroke-width="3" stroke-linecap="round" opacity="0.7">
    <line x1="64" y1="38" x2="64" y2="46"/>
    <line x1="64" y1="106" x2="64" y2="114"/>
    <line x1="26" y1="76" x2="34" y2="76"/>
    <line x1="94" y1="76" x2="102" y2="76"/>
  </g>
  <!-- hand (the one thing the user waited for) -->
  <line x1="64" y1="76" x2="88" y2="54" stroke="#ffe135" stroke-width="5" stroke-linecap="round"/>
  <line x1="64" y1="76" x2="64" y2="58" stroke="#ffe135" stroke-width="4" stroke-linecap="round"/>
  <circle cx="64" cy="76" r="6" fill="#ffe135"/>
  <circle cx="64" cy="76" r="2.5" fill="#7e57c2"/>
</svg>
