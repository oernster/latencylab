[build-system]
# >=77 for the PEP 639 `license` SPDX expression and `license-files` below.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "latencylab"
dynamic = ["version"]
description = "Design-time latency exploration tool for event-driven interactive systems"
readme = "README.md"
requires-python = ">=3.10"
# The published distribution is the headless core only (see the packages.find
# rules below) and that code is GPL-3.0. The PySide6 front end under
# latencylab_ui/ is LGPL-3.0 and is not distributed here; its text lives in
# latencylab_ui/LGPL3.txt.
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = []

[tool.setuptools.dynamic]
# The root VERSION file is the single source of truth for the version.
version = {file = "VERSION"}

[project.scripts]
latencylab = "latencylab.__main__:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "black>=24",
  "flake8>=7",
  # Legacy v1 compat for exact-output regression tests.
  "numpy>=1.26",
]

# Everything the delivery scripts need and the application does not. Kept
# separate so a contributor running the suite does not install a compiler.
build = [
  # generate_icons.py derives every platform icon from the master PNG.
  "pillow>=10",
  # buildexe.py and buildinstaller.py (Windows).
  "nuitka>=2",
  # builddmg.py (macOS).
  "pyinstaller>=6",
]

# Legacy (NumPy-backed) simulator execution path.
legacy = [
  "numpy>=1.26",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The coverage gate lives here rather than in a command line people have to
# remember, so a bare `python -m pytest` enforces it and there is no way to run
# the suite without it. The scoped source set is in .coveragerc, so `--cov=.`
# resolves to the product code.
addopts = """
    --cov=.
    --cov-report=term-missing
    --cov-fail-under=100
"""

[tool.black]
line-length = 88


[tool.setuptools.packages.find]
# The distributable is the CLI core. `latencylab*` also globs `latencylab_ui`,
# so the GUI has to be excluded by name for the wheel to contain what every
# other document says it contains.
include = ["latencylab*"]
exclude = ["plans*", "examples*", "tests*", "latencylab_ui*"]

