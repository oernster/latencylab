[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "latencylab"
version = "0.1.0"
description = "Design-time latency exploration tool for event-driven interactive systems"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
latencylab = "latencylab.__main__:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "black>=24",
  "flake8>=7",
  # Legacy v1 compat for exact-output regression tests.
  "numpy>=1.26",
]

# Legacy (NumPy-backed) simulator execution path.
legacy = [
  "numpy>=1.26",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The gate lives here rather than in a command line people have to remember.
# It was previously opt-in, so `python -m pytest` (the command the README gave
# first) enforced nothing at all and the repository's 100% claim rested on
# whoever ran it typing the longer form. The scoped source set is in
# .coveragerc, so `--cov=.` resolves to the product code either way.
addopts = """
    --cov=.
    --cov-report=term-missing
    --cov-fail-under=100
"""

[tool.black]
line-length = 88


[tool.setuptools.packages.find]
include = ["latencylab*"]
exclude = ["plans*", "examples*", "tests*"]

